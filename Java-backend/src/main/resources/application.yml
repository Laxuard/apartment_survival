spring:
  application:
    name: survival

  threads:
    virtual:
      enabled: true

  mvc:
    problemdetails:
      enabled: true
    apiversion:
      use:
        header: API-Version
      default: 1.0

#   datasource:
#     url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
#     username: ${DB_USER:postgres}
#     password: ${DB_PASSWORD:postgres}
#     driver-class-name: org.postgresql.Driver
#     hikari:
#       maximum-pool-size: 10
#       minimum-idle: 5
#       idle-timeout: 300000
#       connection-timeout: 20000


  jpa:
    open-in-view: false 
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        '[format_sql]': true
        jdbc:
          '[time_zone]': UTC
    show-sql: false # Set to true locally when debugging queries


server:
  port: 8080
  servlet:
    session:
      timeout: 15m
      tracking-modes: COOKIE
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false # Set to true in production behind HTTPS
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized