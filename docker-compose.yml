services:
  postgres:
    image: postgres:16-alpine
    container_name: apartment_survival_db
    environment:
      POSTGRES_DB: apartment_survival
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apartment_survival"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
