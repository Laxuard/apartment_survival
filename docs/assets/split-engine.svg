<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="splitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F1E7" />
      <stop offset="100%" stop-color="#EDE6D8" />
    </linearGradient>
    <filter id="splitShadow" x="-3%" y="-2%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2B2420" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="240" rx="12" fill="url(#splitGrad)" stroke="#E8DFCF" stroke-width="1.2" />

  <!-- STEP 1: Expense Logged -->
  <g transform="translate(24, 40)" filter="url(#splitShadow)">
    <rect width="180" height="155" rx="8" fill="#FFFFFF" stroke="#E8DFCF" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 28 L 0 28 Z" fill="#F6F1E7" />
    <text x="12" y="19" fill="#2B2420" class="font-sans" font-size="11" font-weight="700">1. Expense Logged</text>
    <g transform="translate(14, 44)">
      <text x="0" y="12" fill="#2B2420" class="font-sans" font-size="11.5" font-weight="600">Total: 450.00 MAD</text>
      <text x="0" y="28" fill="#8A7F6E" class="font-sans" font-size="10">Paid by: You (User)</text>
      <rect x="0" y="42" width="152" height="42" rx="6" fill="#F6F1E7" stroke="#E8DFCF" stroke-width="1" />
      <text x="8" y="58" fill="#8A7F6E" class="font-mono" font-size="9.5">Equal / Custom Share</text>
      <text x="8" y="74" fill="#C1793D" class="font-mono" font-size="9.5" font-weight="700">3 Roommates Split</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(210, 115)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#C1793D" stroke-width="2" />
    <polygon points="30,0 22,-4 22,4" fill="#C1793D" />
  </g>

  <!-- STEP 2: Calculation Engine -->
  <g transform="translate(246, 40)" filter="url(#splitShadow)">
    <rect width="180" height="155" rx="8" fill="#FFFFFF" stroke="#C1793D" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 28 L 0 28 Z" fill="#F6E8D6" />
    <text x="12" y="19" fill="#A8632C" class="font-sans" font-size="11" font-weight="700">2. Split Engine</text>
    <g transform="translate(14, 44)">
      <text x="0" y="12" fill="#2B2420" class="font-sans" font-size="11.5" font-weight="600">Per-Member Shares</text>
      <text x="0" y="32" fill="#8A7F6E" class="font-mono" font-size="10">You:      150.00 MAD</text>
      <text x="0" y="50" fill="#8A7F6E" class="font-mono" font-size="10">Sarah:    150.00 MAD</text>
      <text x="0" y="68" fill="#8A7F6E" class="font-mono" font-size="10">Yassine:  150.00 MAD</text>
      <text x="0" y="88" fill="#3F6E52" class="font-mono" font-size="9" font-weight="700">Deterministic Sum</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(432, 115)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#C1793D" stroke-width="2" />
    <polygon points="30,0 22,-4 22,4" fill="#C1793D" />
  </g>

  <!-- STEP 3: Net Balances -->
  <g transform="translate(468, 40)" filter="url(#splitShadow)">
    <rect width="180" height="155" rx="8" fill="#FFFFFF" stroke="#E8DFCF" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 28 L 0 28 Z" fill="#F6F1E7" />
    <text x="12" y="19" fill="#2B2420" class="font-sans" font-size="11" font-weight="700">3. Net Ledger</text>
    <g transform="translate(14, 44)">
      <text x="0" y="12" fill="#2B2420" class="font-sans" font-size="11.5" font-weight="600">Aggregated Balances</text>
      <text x="0" y="32" fill="#3F6E52" class="font-mono" font-size="10" font-weight="700">You:     +300.00 MAD</text>
      <text x="0" y="50" fill="#B5482F" class="font-mono" font-size="10" font-weight="700">Sarah:   -150.00 MAD</text>
      <text x="0" y="68" fill="#B5482F" class="font-mono" font-size="10" font-weight="700">Yassine: -150.00 MAD</text>
      <text x="0" y="88" fill="#8A7F6E" class="font-sans" font-size="9">Circular IOUs collapsed</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(654, 115)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#C1793D" stroke-width="2" />
    <polygon points="30,0 22,-4 22,4" fill="#C1793D" />
  </g>

  <!-- STEP 4: Simplified Settlement -->
  <g transform="translate(690, 40)" filter="url(#splitShadow)">
    <rect width="184" height="155" rx="8" fill="#EAEFE3" stroke="#6B7A5E" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 176 0 Q 184 0 184 8 L 184 28 L 0 28 Z" fill="#D8E4D0" />
    <text x="12" y="19" fill="#3F6E52" class="font-sans" font-size="11" font-weight="700">4. Direct Settlements</text>
    <g transform="translate(14, 44)">
      <text x="0" y="12" fill="#2B2420" class="font-sans" font-size="11.5" font-weight="600">Minimum Transactions</text>
      <rect x="0" y="24" width="156" height="32" rx="5" fill="#FFFFFF" stroke="#6B7A5E" stroke-width="0.8" />
      <text x="6" y="44" fill="#2B2420" class="font-sans" font-size="10">Sarah &#8594; You: 150 MAD</text>
      <rect x="0" y="60" width="156" height="32" rx="5" fill="#FFFFFF" stroke="#6B7A5E" stroke-width="0.8" />
      <text x="6" y="80" fill="#2B2420" class="font-sans" font-size="10">Yassine &#8594; You: 150 MAD</text>
    </g>
  </g>
</svg>
